<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <meta
            name="description"
            content="News Portal — search and read news from all over the internet."
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <link rel="icon" href="data:," />
        <title>News Portal</title>
    </head>
    <body>
        <header class="header">
            <div class="header__top">
                <span class="header__logo">News Portal</span>
            </div>
            <h1 class="header__title">Read the world.</h1>
            <p class="header__subtitle">
                Fresh headlines from trusted sources — powered by News API.
            </p>
        </header>
        <main class="main">
            <div class="sources buttons" role="tablist" aria-label="News sources"></div>
            <div class="news" aria-live="polite"></div>
        </main>
        <footer class="footer">
            <a
                class="footer__link footer__github"
                href="https://github.com/a-heras"
                target="_blank"
                rel="noopener noreferrer"
                >GitHub</a
            >
            <span class="footer__year">© 2026</span>
            <a
                class="footer__link footer__logo"
                href="https://rs.school/js/"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="RS School JS course"
            >
                <img
                    src="https://rs.school/_next/static/media/rss-logo.c19ce1b4.svg"
                    alt="RS School"
                    width="80"
                    height="30"
                />
            </a>
        </footer>

        <template id="sourceItemTemp">
            <div class="source__item" role="tab">
                <span class="source__item-name"></span>
            </div>
        </template>

        <template id="newsItemTemp">
            <div class="news__item">
                <div class="news__meta">
                    <div class="news__meta-photo"></div>
                    <ul class="news__meta-details">
                        <li class="news__meta-author"></li>
                        <li class="news__meta-date"></li>
                    </ul>
                </div>
                <div class="news__description">
                    <h2 class="news__description-title"></h2>
                    <h3 class="news__description-source"></h3>
                    <p class="news__description-content"></p>
                    <p class="news__read-more">
                        <a href="#" target="_blank" rel="noopener noreferrer">Read More</a>
                    </p>
                </div>
            </div>
        </template>
    </body>
</html>
